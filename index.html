<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AgroDash: Da Cidade ao Campo</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; pointer-events: none; }
        .score-box { background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px; display: inline-block; }
        .score { font-size: 32px; color: #ADFF2F; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="score-box">
            <div class="score">Sementes: <span id="scoreVal">0</span></div>
            <p>Use as <b>SETAS</b> para desviar dos obstáculos!</p>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

<script type="module">
    import * as THREE from 'three';

    // 1. CONFIGURAÇÃO DA CENA
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); 
    scene.fog = new THREE.Fog(0x87CEEB, 20, 100); // Neblina para suavizar o horizonte

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. ILUMINAÇÃO
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(10, 20, 10);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x606060));

    // 3. ESTRADA E RUA
    const roadGeo = new THREE.PlaneGeometry(12, 1000);
    const roadMat = new THREE.MeshPhongMaterial({ color: 0x333333 }); // Asfalto
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    // Linhas da estrada
    for (let i = 0; i < 50; i++) {
        const lineGeo = new THREE.PlaneGeometry(0.2, 3);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const line = new THREE.Mesh(lineGeo, lineMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(0, 0.01, -i * 10);
        scene.add(line);
    }

    // 4. PAISAGEM (CIDADES E PRÉDIOS)
    function createBuilding(x, z) {
        const h = Math.random() * 10 + 5;
        const geo = new THREE.BoxGeometry(4, h, 4);
        const mat = new THREE.MeshPhongMaterial({ color: 0x808080 });
        const b = new THREE.Mesh(geo, mat);
        b.position.set(x, h/2, z);
        scene.add(b);
    }

    for (let i = 0; i < 40; i++) {
        createBuilding(-10, -i * 15); // Lado esquerdo
        createBuilding(10, -i * 15);  // Lado direito
    }

    // 5. JOGADOR (PERSONAGEM)
    const player = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 1), new THREE.MeshPhongMaterial({color: 0x228B22}));
    player.add(body);
    player.position.y = 0.75;
    scene.add(player);

    camera.position.set(0, 4, 6);
    camera.lookAt(0, 0, -5);

    // 6. LÓGICA DO JOGO
    let score = 0;
    const lanes = [-4, 0, 4];
    let currentLane = 1;
    const obstacles = [];
    const items = [];

    window.addEventListener('keydown', (e) => {
        if (e.key === "ArrowLeft" && currentLane > 0) currentLane--;
        if (e.key === "ArrowRight" && currentLane < 2) currentLane++;
    });

    function spawn() {
        const lane = lanes[Math.floor(Math.random() * 3)];
        if (Math.random() > 0.4) {
            // Obstáculo (Barril de Poluição)
            const obs = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.5), new THREE.MeshPhongMaterial({color: 0x222222}));
            obs.position.set(lane, 0.75, -60);
            scene.add(obs);
            obstacles.push(obs);
        } else {
            // Item (Semente de Ouro)
            const item = new THREE.Mesh(new THREE.OctahedronGeometry(0.5), new THREE.MeshPhongMaterial({color: 0xFFD700}));
            item.position.set(lane, 1, -60);
            scene.add(item);
            items.push(item);
        }
    }

    setInterval(spawn, 800);

    function animate() {
        requestAnimationFrame(animate);

        // Movimento suave lateral
        player.position.x = THREE.MathUtils.lerp(player.position.x, lanes[currentLane], 0.15);

        // Movimentar obstáculos
        obstacles.forEach((obs, i) => {
            obs.position.z += 0.6;
            if (obs.position.z > 5) { scene.remove(obs); obstacles.splice(i, 1); }
            // Colisão
            if (obs.position.z > -0.5 && obs.position.z < 0.5 && Math.abs(obs.position.x - player.position.x) < 1) {
                alert("Game Over! A poluição urbana te parou. Sementes coletadas: " + score);
                location.reload();
            }
        });

        // Movimentar itens
        items.forEach((item, i) => {
            item.position.z += 0.6;
            item.rotation.y += 0.05;
            if (item.position.z > -0.5 && item.position.z < 0.5 && Math.abs(item.position.x - player.position.x) < 1) {
                scene.remove(item);
                items.splice(i, 1);
                score += 10;
                document.getElementById('scoreVal').innerText = score;
            }
        });

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>
