<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AgroDash 3D - Agrinho 2026</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; pointer-events: none; }
        .score { font-size: 30px; color: #7cfc00; font-weight: bold; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="score">Sementes: <span id="scoreVal">0</span></div>
        <p>Use SETAS para mover o Trator</p>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

<script type="module">
    import * as THREE from 'three';

    // Configuração Básica
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Céu
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Luzes
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // Chão (Estrada)
    const groundGeo = new THREE.PlaneGeometry(10, 1000);
    const groundMat = new THREE.MeshPhongMaterial({ color: 0x694322 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Jogador (Trator Simplificado)
    const playerGroup = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 1.2), new THREE.MeshPhongMaterial({color: 0x00ff00}));
    playerGroup.add(body);
    scene.add(playerGroup);
    playerGroup.position.y = 0.4;

    camera.position.set(0, 3, 5);
    camera.lookAt(playerGroup.position);

    // Variáveis de Jogo
    let score = 0;
    const lanes = [-2, 0, 2];
    let currentLane = 1;
    const obstacles = [];
    const items = [];

    // Movimentação
    window.addEventListener('keydown', (e) => {
        if (e.key === "ArrowLeft" && currentLane > 0) currentLane--;
        if (e.key === "ArrowRight" && currentLane < 2) currentLane++;
    });

    function spawn() {
        const lane = lanes[Math.floor(Math.random() * 3)];
        if (Math.random() > 0.5) {
            // Obstáculo (Cubo Vermelho - Poluição)
            const obs = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshPhongMaterial({color: 0xff0000}));
            obs.position.set(lane, 0.5, -50);
            scene.add(obs);
            obstacles.push(obs);
        } else {
            // Item (Esfera Dourada - Semente)
            const item = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshPhongMaterial({color: 0xffff00}));
            item.position.set(lane, 0.5, -50);
            scene.add(item);
            items.push(item);
        }
    }

    setInterval(spawn, 1000);

    function animate() {
        requestAnimationFrame(animate);

        // Suavizar movimento do jogador
        playerGroup.position.x = THREE.MathUtils.lerp(playerGroup.position.x, lanes[currentLane], 0.1);

        // Mover e checar obstáculos
        obstacles.forEach((obs, index) => {
            obs.position.z += 0.5;
            if (obs.position.z > 5) {
                scene.remove(obs);
                obstacles.splice(index, 1);
            }
            // Colisão simples
            if (obs.position.z > -0.5 && obs.position.z < 0.5 && Math.abs(obs.position.x - playerGroup.position.x) < 0.5) {
                alert("Fim de jogo! Pontuação: " + score);
                location.reload();
            }
        });

        // Mover e checar itens
        items.forEach((item, index) => {
            item.position.z += 0.5;
            item.rotation.y += 0.1;
            if (item.position.z > -0.5 && item.position.z < 0.5 && Math.abs(item.position.x - playerGroup.position.x) < 0.5) {
                scene.remove(item);
                items.splice(index, 1);
                score += 10;
                document.getElementById('scoreVal').innerText = score;
            }
        });

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>
