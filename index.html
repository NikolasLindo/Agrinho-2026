<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AgroDash 3D - Com Calçadas</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; pointer-events: none; z-index: 10; }
        .score-box { background: rgba(0,0,0,0.7); padding: 15px; border-radius: 15px; border: 2px solid #ADFF2F; }
        .score { font-size: 35px; color: #ADFF2F; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="score-box">
            <div class="score">Sementes: <span id="scoreVal">0</span></div>
            <p>A cidade ganhou calçadas! Desvie dos barris.</p>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 10, 70);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(5, 20, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    // --- VARIÁVEIS ---
    const speed = 0.9;
    const lanes = [-4, 0, 4];
    let currentLane = 1;
    let score = 0;

    // --- ESTRADA CENTRAL (ASFALTO) ---
    const roadGeo = new THREE.PlaneGeometry(12, 1000);
    const roadMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    // --- CALÇADAS (CHÃO DOS PRÉDIOS) ---
    // Calçada Esquerda
    const sideGeo = new THREE.PlaneGeometry(20, 1000);
    const sideMat = new THREE.MeshPhongMaterial({ color: 0x999999 }); // Cinza claro
    const sidewalkLeft = new THREE.Mesh(sideGeo, sideMat);
    sidewalkLeft.rotation.x = -Math.PI / 2;
    sidewalkLeft.position.set(-16, 0.05, 0); // Um pouco acima da estrada para não bugar o visual
    scene.add(sidewalkLeft);

    // Calçada Direita
    const sidewalkRight = sidewalkLeft.clone();
    sidewalkRight.position.set(16, 0.05, 0);
    scene.add(sidewalkRight);

    // --- PRÉDIOS ---
    const buildings = [];
    function createBuilding(z) {
        const h = Math.random() * 15 + 8;
        const w = 6;
        const geo = new THREE.BoxGeometry(w, h, 6);
        const mat = new THREE.MeshPhongMaterial({ color: 0x666666 });
        
        const bLeft = new THREE.Mesh(geo, mat);
        bLeft.position.set(-10, h/2, z);
        scene.add(bLeft);
        buildings.push(bLeft);

        const bRight = new THREE.Mesh(geo, mat);
        bRight.position.set(10, h/2, z);
        scene.add(bRight);
        buildings.push(bRight);
    }

    for (let i = 0; i < 20; i++) {
        createBuilding(-i * 12);
    }

    // --- JOGADOR ---
    const player = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 1.2, 1.2),
        new THREE.MeshPhongMaterial({ color: 0x228B22 })
    );
    player.position.y = 0.6;
    scene.add(player);

    camera.position.set(0, 5, 8);
    camera.lookAt(0, 1, -2);

    // --- OBSTÁCULOS E ITENS ---
    const obstacles = [];
    const items = [];

    window.addEventListener('keydown', (e) => {
        if (e.key === "ArrowLeft" && currentLane > 0) currentLane--;
        if (e.key === "ArrowRight" && currentLane < 2) currentLane++;
    });

    function spawn() {
        const lane = lanes[Math.floor(Math.random() * 3)];
        if (Math.random() > 0.5) {
            const obs = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({color: 0xcc0000}));
            obs.position.set(lane, 0.75, -80);
            scene.add(obs);
            obstacles.push(obs);
        } else {
            const item = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshPhongMaterial({color: 0xffff00}));
            item.position.set(lane, 0.8, -80);
            scene.add(item);
            items.push(item);
        }
    }
    setInterval(spawn, 1000);

    // --- ANIMAÇÃO ---
    function animate() {
        requestAnimationFrame(animate);

        player.position.x = THREE.MathUtils.lerp(player.position.x, lanes[currentLane], 0.15);

        // Movendo os prédios para criar efeito de corrida
        buildings.forEach(b => {
            b.position.z += speed;
            if (b.position.z > 15) {
                b.position.z = -150;
                b.scale.y = Math.random() * 2 + 0.5;
            }
        });

        // Obstáculos e itens
        obstacles.forEach((obs, i) => {
            obs.position.z += speed;
            if (obs.position.z > 10) { scene.remove(obs); obstacles.splice(i, 1); }
            if (obs.position.z > -0.7 && obs.position.z < 0.7 && Math.abs(obs.position.x - player.position.x) < 1.2) {
                alert("Fim de jogo! Pontos: " + score);
                location.reload();
            }
        });

        items.forEach((item, i) => {
            item.position.z += speed;
            if (item.position.z > -0.7 && item.position.z < 0.7 && Math.abs(item.position.x - player.position.x) < 1.2) {
                scene.remove(item);
                items.splice(i, 1);
                score += 10;
                document.getElementById('scoreVal').innerText = score;
            }
        });

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>
