<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroDash Rural - Agrinho 2026</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
    font-family:'Segoe UI',sans-serif;
}
#ui{
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;
    color:white;
    pointer-events:none;
    z-index:5;
}
.score-box{
    background:rgba(58,95,11,.8);
    padding:10px 25px;
    border-radius:20px;
    border:2px solid #FFD700;
    display:inline-block;
}
.score{
    font-size:30px;
    color:#FFD700;
    font-weight:bold;
}
#gameOverPanel{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(255,255,255,.95);
    padding:40px;
    border-radius:30px;
    border:8px solid #3A5F0B;
    text-align:center;
    display:none;
    z-index:100;
    box-shadow:0 0 50px rgba(0,0,0,.5);
    min-width:300px;
}
#gameOverPanel h2{
    color:#cc0000;
    font-size:40px;
    margin:0;
}
#gameOverPanel p{
    color:#333;
    font-size:20px;
    margin:20px 0;
}
.btn-restart{
    background:#3A5F0B;
    color:white;
    border:none;
    padding:15px 40px;
    font-size:20px;
    font-weight:bold;
    border-radius:50px;
    cursor:pointer;
    transition:.3s;
}
.btn-restart:hover{
    background:#558B0F;
    transform:scale(1.1);
}
</style>
</head>
<body>
<div id="ui">
    <div class="score-box">
        <div class="score">
            Sementes: <span id="scoreVal">0</span>
        </div>
    </div>
</div>
<div id="gameOverPanel">
    <h2>FIM DE JOGO!</h2>
    <p>A poluição prejudicou a colheita.</p>
    <p>Você coletou:
        <b id="finalScore" style="color:#3A5F0B;">0</b>
        sementes.
    </p>
    <button class="btn-restart" onclick="restartGame()">
        RECOMEÇAR
    </button>
</div>

<script type="importmap">
{
    "imports":{
        "three":"https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- CENA ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB,20,100);

// ---------- CAMERA ----------
const camera = new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,6,10);
camera.lookAt(0,0,-5);

// ---------- RENDERER ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// ---------- LUZES ----------
const sun = new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(10,20,10);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff,0.4));

// ---------- ESTADO ----------
let gameRunning = true;
let score = 0;
const speed = 0.8;
const lanes = [-4,0,4];
let currentLane = 1;

// ---------- CHÃO ----------
const road = new THREE.Mesh(new THREE.PlaneGeometry(12,1000),new THREE.MeshPhongMaterial({color:0x8B4513}));
road.rotation.x = -Math.PI/2;
scene.add(road);
const grass = new THREE.Mesh(new THREE.PlaneGeometry(100,1000),new THREE.MeshPhongMaterial({color:0x228B22}));
grass.rotation.x = -Math.PI/2;
grass.position.y=-0.1;
scene.add(grass);

// ---------- ÁRVORES ----------
const sceneryItems = [];
function createScenery(z){
    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.5,0.5,2),
        new THREE.MeshPhongMaterial({color:0x5D3A1A})
    );
    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(2),
        new THREE.MeshPhongMaterial({color:0x006400})
    );
    leaves.position.y=2;
    const tree = new THREE.Group();
    tree.add(trunk);
    tree.add(leaves);
    const xPos = Math.random()>0.5?12+Math.random()*5:-12-Math.random()*5;
    tree.position.set(xPos,1,z);
    scene.add(tree);
    sceneryItems.push(tree);
}
for(let i=0;i<25;i++) createScenery(-i*15);

// ---------- AGROFORTE ULTRA TRACTOR ----------
const player = new THREE.Group();

const greenMat = new THREE.MeshPhongMaterial({
    color:0x2E7D32,
    shininess:80
});

const darkMat = new THREE.MeshPhongMaterial({
    color:0x1a1a1a
});

const metalMat = new THREE.MeshPhongMaterial({
    color:0x777777,
    shininess:120
});

const glassMat = new THREE.MeshPhongMaterial({
    color:0xaadfff,
    transparent:true,
    opacity:0.45
});

// CHASSI
const chassis = new THREE.Mesh(
    new THREE.BoxGeometry(2.5,0.8,4),
    greenMat
);
chassis.position.y=0.8;
player.add(chassis);

// CAPÔ
const hood = new THREE.Mesh(
    new THREE.BoxGeometry(2,1,2.4),
    greenMat
);
hood.position.set(0,1.1,-1.2);
player.add(hood);

// TOPO CAPÔ
const hoodTop = new THREE.Mesh(
    new THREE.BoxGeometry(1.8,0.2,2.2),
    greenMat
);
hoodTop.position.set(0,1.7,-1.2);
player.add(hoodTop);

// GRADE FRONTAL
for(let i=0;i<8;i++){
    const grill = new THREE.Mesh(
        new THREE.BoxGeometry(0.15,1.2,0.05),
        darkMat
    );

    grill.position.set(
        -0.55 + i*0.16,
        1,
        -2.45
    );

    player.add(grill);
}

// CONTRAPESO
const weight = new THREE.Mesh(
    new THREE.BoxGeometry(1.5,1,0.8),
    darkMat
);
weight.position.set(0,0.6,-2.9);
player.add(weight);

// CABINE
const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(2.1,2,2),
    glassMat
);
cabin.position.set(0,2.2,0.8);
player.add(cabin);

// TETO
const roof = new THREE.Mesh(
    new THREE.BoxGeometry(2.4,0.25,2.2),
    greenMat
);
roof.position.set(0,3.3,0.8);
player.add(roof);

// BANCO
const seat = new THREE.Mesh(
    new THREE.BoxGeometry(0.8,1,0.8),
    darkMat
);
seat.position.set(0,1.6,0.8);
player.add(seat);

// VOLANTE
const wheel = new THREE.Mesh(
    new THREE.TorusGeometry(0.3,0.05,8,20),
    darkMat
);
wheel.position.set(-0.4,2,0);
wheel.rotation.x=Math.PI/2;
player.add(wheel);

// ESCADAS
for(let i=0;i<4;i++){
    const step = new THREE.Mesh(
        new THREE.BoxGeometry(0.6,0.08,0.3),
        metalMat
    );

    step.position.set(
        1.5,
        0.6 + i*0.35,
        0.3
    );

    player.add(step);
}

// RETROVISORES
for(let side of [-1,1]){
    const arm = new THREE.Mesh(
        new THREE.BoxGeometry(0.05,0.4,0.05),
        metalMat
    );

    arm.position.set(side*1.25,2.7,0.2);
    player.add(arm);

    const mirror = new THREE.Mesh(
        new THREE.BoxGeometry(0.3,0.25,0.08),
        darkMat
    );

    mirror.position.set(side*1.35,2.8,0.2);
    player.add(mirror);
}

// ESCAPAMENTOS DUPLOS
for(let side of [-0.6,0.6]){
    const pipe = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08,0.08,2),
        metalMat
    );

    pipe.position.set(side,2.2,-1.8);
    player.add(pipe);
}

// GIROFLEX
for(let side of [-0.8,0.8]){
    const beacon = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15,0.15,0.25,12),
        new THREE.MeshPhongMaterial({
            color:0xff9900,
            emissive:0xff6600,
            emissiveIntensity:1
        })
    );

    beacon.position.set(side,3.55,0.8);
    player.add(beacon);
}

// FARÓIS
const headMat = new THREE.MeshPhongMaterial({
    color:0xffffff,
    emissive:0xffffff,
    emissiveIntensity:2
});

for(let i=0;i<4;i++){

    const light = new THREE.Mesh(
        new THREE.SphereGeometry(0.12,16,16),
        headMat
    );

    light.position.set(
        -0.6 + i*0.4,
        1.3,
        -2.3
    );

    player.add(light);
}

// RODAS
const wheelMaterial = new THREE.MeshPhongMaterial({
    color:0x111111
});

const rimMaterial = new THREE.MeshPhongMaterial({
    color:0xffcc00
});

function createWheel(radius,width){

    const group = new THREE.Group();

    const tire = new THREE.Mesh(
        new THREE.CylinderGeometry(radius,radius,width,24),
        wheelMaterial
    );

    tire.rotation.z=Math.PI/2;

    const rim = new THREE.Mesh(
        new THREE.CylinderGeometry(radius*0.55,radius*0.55,width+0.02,20),
        rimMaterial
    );

    rim.rotation.z=Math.PI/2;

    group.add(tire);
    group.add(rim);

    return group;
}

const backLeft = createWheel(1.05,0.7);
backLeft.position.set(-1.6,0.9,1.1);
player.add(backLeft);

const backRight = createWheel(1.05,0.7);
backRight.position.set(1.6,0.9,1.1);
player.add(backRight);

const frontLeft = createWheel(0.7,0.5);
frontLeft.position.set(-1.3,0.7,-1.5);
player.add(frontLeft);

const frontRight = createWheel(0.7,0.5);
frontRight.position.set(1.3,0.7,-1.5);
player.add(frontRight);

// PARA-LAMAS
for(let side of [-1.6,1.6]){

    const fender = new THREE.Mesh(
        new THREE.BoxGeometry(0.4,0.25,1.4),
        greenMat
    );

    fender.position.set(side,1.8,1.1);

    player.add(fender);
}

// LOGO AGROFORTE
const logo = new THREE.Mesh(
    new THREE.BoxGeometry(0.05,0.7,1.5),
    new THREE.MeshPhongMaterial({
        color:0xffd700
    })
);

logo.position.set(1.27,1.5,-0.3);
player.add(logo);

scene.add(player);

player.userData.wheels = [
    backLeft,
    backRight,
    frontLeft,
    frontRight
];

// ---------- FUMAÇA (agora como filho do player) ----------
const smokeParticles = [];
const smokeCount = 100;
const smokePositions = new Float32Array(smokeCount*3);
const smokeVelocities = new Float32Array(smokeCount*3); // para movimento mais natural

for(let i=0;i<smokeCount;i++){
    // Posição inicial relativa ao escapamento
    smokePositions[i*3+0] = -0.6 + (Math.random()-0.5)*0.15;
    smokePositions[i*3+1] = 1.6 + Math.random()*0.2;
    smokePositions[i*3+2] = -1 + (Math.random()-0.5)*0.15;
    
    smokeVelocities[i*3+0] = (Math.random()-0.5)*0.015;
    smokeVelocities[i*3+1] = 0.025 + Math.random()*0.015;
    smokeVelocities[i*3+2] = (Math.random()-0.5)*0.01;
}

const smokeGeometry = new THREE.BufferGeometry();
smokeGeometry.setAttribute('position',new THREE.BufferAttribute(smokePositions,3));

const smokeMaterial = new THREE.PointsMaterial({
    color:0x555555,
    size:0.28,
    transparent:true,
    opacity:0.65,
    depthTest: true
});

const smoke = new THREE.Points(smokeGeometry, smokeMaterial);
player.add(smoke); // ← Agora é filho do player!
player.userData.smoke = smoke;
player.userData.smokeVelocities = smokeVelocities;

// ---------- OBSTÁCULOS E ITENS ----------
const obstacles = [];
const items = [];

// ---------- CONTROLES ----------
window.addEventListener('keydown', (e) => {
    if (!gameRunning) return;
    if (e.key === "ArrowLeft" && currentLane > 0) currentLane--;
    if (e.key === "ArrowRight" && currentLane < 2) currentLane++;
});

// ---------- SPAWN ----------
function spawn() {
    if (!gameRunning) return;
    const lane = lanes[Math.floor(Math.random() * 3)];
    if (Math.random() > 0.5) {
        const obs = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 1.8), new THREE.MeshPhongMaterial({color: 0x333333}));
        obs.position.set(lane, 0.9, -100);
        scene.add(obs);
        obstacles.push(obs);
    } else {
        const item = new THREE.Mesh(new THREE.SphereGeometry(0.6,16,16), new THREE.MeshPhongMaterial({color:0xFFD700}));
        item.position.set(lane,1,-100);
        scene.add(item);
        items.push(item);
    }
}
setInterval(spawn, 900);

// ---------- GAME OVER ----------
function endGame() {
    gameRunning = false;
    document.getElementById('gameOverPanel').style.display = 'block';
    document.getElementById('finalScore').innerText = score;
}

// ---------- REINICIAR ----------
window.restartGame = () => location.reload();

// ---------- RESPONSIVO ----------
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- ANIMAÇÃO ----------
function animate() {
    requestAnimationFrame(animate);

    if (!gameRunning) {
        renderer.render(scene, camera);
        return;
    }

    // Movimento lateral
    player.position.x = THREE.MathUtils.lerp(player.position.x, lanes[currentLane], 0.15);

    // Rodas girando
    player.userData.wheels.forEach(w => w.rotation.x += 0.15);

    // Cenário
    sceneryItems.forEach(item => {
        item.position.z += speed;
        if(item.position.z > 20){
            item.position.z = -200;
            item.position.x = Math.random() > 0.5 ? 12 + Math.random()*5 : -12 - Math.random()*5;
        }
    });

    // Obstáculos
    for(let i = obstacles.length-1; i >= 0; i--){
        const obs = obstacles[i];
        obs.position.z += speed;
        obs.rotation.y += 0.03;
        if(obs.position.z > 15){
            scene.remove(obs);
            obstacles.splice(i,1);
            continue;
        }
        if(obs.position.z > -1.5 && obs.position.z < 1.5 && Math.abs(obs.position.x - player.position.x) < 1.6){
            endGame();
        }
    }

    // Itens
    for(let i = items.length-1; i >= 0; i--){
        const item = items[i];
        item.position.z += speed;
        item.rotation.y += 0.08;
        item.rotation.x += 0.04;
        if(item.position.z > 15){
            scene.remove(item);
            items.splice(i,1);
            continue;
        }
        if(item.position.z > -1.5 && item.position.z < 1.5 && Math.abs(item.position.x - player.position.x) < 1.6){
            scene.remove(item);
            items.splice(i,1);
            score += 10;
            document.getElementById('scoreVal').innerText = score;
        }
    }

    // Fumaça (agora relativa ao player)
    const positions = smoke.geometry.attributes.position.array;
    const velocities = player.userData.smokeVelocities;

    for(let i=0;i<smokeCount;i++){
        const idx = i*3;
        
        positions[idx]     += velocities[idx];     // x
        positions[idx+1]   += velocities[idx+1];   // y
        positions[idx+2]   += velocities[idx+2];   // z

        // Suaviza o movimento lateral
        velocities[idx] *= 0.98;
        velocities[idx+2] *= 0.98;

        // Reset quando subir demais
        if(positions[idx+1] > 4.5){
            positions[idx]   = -0.6 + (Math.random()-0.5)*0.2;
            positions[idx+1] = 1.6 + Math.random()*0.25;
            positions[idx+2] = -1 + (Math.random()-0.5)*0.2;
            
            velocities[idx]   = (Math.random()-0.5)*0.018;
            velocities[idx+1] = 0.028 + Math.random()*0.018;
            velocities[idx+2] = (Math.random()-0.5)*0.012;
        }
    }
    smoke.geometry.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
