<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AgroDash Sustentável - Agrinho 2026</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        canvas { display: block; background: #7cfc00; margin: 0 auto; border-left: 5px solid #555; border-right: 5px solid #555; }
        #ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
        h1 { color: white; text-shadow: 2px 2px #000; margin: 0; }
        .score { font-size: 24px; color: yellow; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>AGRO DASH 2026</h1>
        <div class="score">Sementes: <span id="scoreVal">0</span></div>
        <p>Use as setas <b>ESQUERDA / DIREITA</b> para mover</p>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("scoreVal");

    // Ajuste de tela
    canvas.width = 400;
    canvas.height = window.innerHeight;

    let score = 0;
    let gameActive = true;
    const lanes = [80, 200, 320]; // Três faixas (Subway Surfers style)
    let currentLane = 1; // Começa no meio

    // Jogador (Trator)
    const player = {
        x: lanes[currentLane],
        y: canvas.height - 120,
        width: 50,
        height: 80,
        targetX: lanes[currentLane]
    };

    const obstacles = [];
    const items = [];

    // Controles
    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" && currentLane > 0) currentLane--;
        if (e.key === "ArrowRight" && currentLane < 2) currentLane++;
        player.targetX = lanes[currentLane];
    });

    function spawnObject() {
        const lane = lanes[Math.floor(Math.random() * 3)];
        const isItem = Math.random() > 0.4;

        if (isItem) {
            items.push({ x: lane, y: -50, radius: 15, speed: 5 });
        } else {
            obstacles.push({ x: lane - 25, y: -50, w: 50, h: 50, speed: 6 });
        }
    }

    setInterval(() => { if(gameActive) spawnObject(); }, 1200);

    function update() {
        if (!gameActive) return;

        // Suavizar movimento lateral
        player.x += (player.targetX - player.x) * 0.2;

        // Atualizar Obstáculos (Poluição)
        obstacles.forEach((obs, index) => {
            obs.y += obs.speed;
            // Colisão
            if (obs.y + obs.h > player.y && obs.y < player.y + player.height &&
                Math.abs((obs.x + 25) - player.x) < 30) {
                gameActive = false;
                alert("Game Over! Você atingiu poluição. Pontuação: " + score);
                location.reload();
            }
            if (obs.y > canvas.height) obstacles.splice(index, 1);
        });

        // Atualizar Itens (Sementes)
        items.forEach((item, index) => {
            item.y += item.speed;
            // Coleta
            if (item.y + 15 > player.y && item.y < player.y + player.height &&
                Math.abs(item.x - player.x) < 30) {
                items.splice(index, 1);
                score += 10;
                scoreElement.innerText = score;
            }
            if (item.y > canvas.height) items.splice(index, 1);
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Estradas
        ctx.fillStyle = "#694322"; // Cor de terra
        ctx.fillRect(40, 0, 320, canvas.height);
        
        // Faixas
        ctx.strokeStyle = "rgba(255,255,255,0.3)";
        ctx.setLineDash([20, 20]);
        ctx.beginPath();
        ctx.moveTo(140, 0); ctx.lineTo(140, canvas.height);
        ctx.moveTo(260, 0); ctx.lineTo(260, canvas.height);
        ctx.stroke();

        // Desenhar Jogador (Trator)
        ctx.fillStyle = "green";
        ctx.fillRect(player.x - 25, player.y, player.width, player.height);
        ctx.fillStyle = "black"; // Rodas
        ctx.fillRect(player.x - 30, player.y + 10, 10, 20);
        ctx.fillRect(player.x + 20, player.y + 10, 10, 20);

        // Desenhar Obstáculos (Barril de óleo/poluição)
        ctx.fillStyle = "#333";
        obstacles.forEach(obs => {
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.fillStyle = "red";
            ctx.fillRect(obs.x, obs.y + 20, obs.w, 10);
            ctx.fillStyle = "#333";
        });

        // Desenhar Sementes
        ctx.fillStyle = "yellow";
        items.forEach(item => {
            ctx.beginPath();
            ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        update();
        requestAnimationFrame(draw);
    }

    draw();
</script>
</body>
</html>
